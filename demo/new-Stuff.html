<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>TutorLink</title>
<style>
:root{
  --ink:#0B1B33;
  --blue:#1A4FD6;
  --blue-deep:#12379A;
  --blue-tint:#EEF3FF;
  --gold:#B8912F;
  --gold-tint:#FBF5E6;
  --paper:#FFFFFF;
  --surface:#F5F7FB;
  --line:#E4E9F2;
  --line-soft:#EEF1F7;
  --muted:#6E7C93;
  --muted-2:#98A4B8;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.4,.42,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);
  background:var(--surface);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}

/* ---------- device frame ---------- */
#device{
  position:relative;
  width:100%;
  height:100vh; height:100dvh;
  background:var(--paper);
  overflow:hidden;
}
@media (min-width:760px) and (min-height:780px){
  body{display:flex;align-items:center;justify-content:center;background:#0B1B33}
  #device{
    width:400px;height:844px;border-radius:46px;
    box-shadow:0 0 0 10px #16233c,0 40px 90px -20px rgba(0,0,0,.7);
  }
  :root{--sat:14px;--sab:16px}
}

/* ---------- screen stack ---------- */
#stage{position:absolute;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;
  background:var(--paper);
  display:flex;flex-direction:column;
  will-change:transform;
  transition:transform .46s var(--ease),filter .46s var(--ease),opacity .3s linear;
}
.screen.enter{transform:translate3d(100%,0,0)}
.screen.behind{transform:translate3d(-24%,0,0);filter:brightness(.94)}
.screen.fade{transition:opacity .32s var(--ease),transform .32s var(--ease)}
.screen.fade.enter{transform:translate3d(0,10px,0);opacity:0}

/* ---------- header ---------- */
.nav{
  padding:calc(var(--sat) + 10px) 18px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line-soft);
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  position:relative;z-index:5;flex:0 0 auto;
}
.nav h1{
  margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em;
  flex:1;text-align:center;
}
.nav .slot{width:44px;display:flex;align-items:center}
.nav .slot.right{justify-content:flex-end}
.iconbtn{
  width:38px;height:38px;margin-left:-9px;
  display:grid;place-items:center;border:0;background:transparent;
  color:var(--blue);border-radius:12px;position:relative;
  transition:transform .18s var(--spring),background .18s ease;
}
.nav .slot.right .iconbtn{margin:0 -9px 0 0}
.iconbtn:active{transform:scale(.9);background:var(--blue-tint)}
.badge{
  position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;
  background:var(--blue);color:#fff;border-radius:9px;
  font-size:10px;font-weight:700;line-height:17px;text-align:center;
  border:2px solid var(--paper);
}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:22px 18px calc(28px + var(--sab))}

/* ---------- type ---------- */
.display{font-size:32px;line-height:1.08;font-weight:700;letter-spacing:-.035em;margin:0}
.sub{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted-2);margin:0 0 12px;
}
.section-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.01em;margin:26px 0 10px}
.section-title:first-child{margin-top:0}

/* ---------- role select ---------- */
.roles{display:flex;flex-direction:column;gap:12px;margin-top:34px}
.role{
  position:relative;display:flex;align-items:center;gap:14px;
  padding:18px;background:var(--paper);border:1px solid var(--line);
  border-radius:20px;text-align:left;font:inherit;color:inherit;width:100%;
  transition:transform .22s var(--spring),box-shadow .22s var(--ease),border-color .22s ease;
}
.role:active{transform:scale(.975)}
.role .rname{font-size:17px;font-weight:600;letter-spacing:-.02em}
.role .rdesc{font-size:13px;color:var(--muted);margin-top:2px}
.role .glyph{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--blue-tint);color:var(--blue);flex:0 0 auto;
}
.role .chev{margin-left:auto;color:var(--muted-2)}
.role.primary{border-color:rgba(184,145,47,.42);box-shadow:0 10px 30px -14px rgba(184,145,47,.5)}
.role.primary .glyph{background:var(--gold-tint);color:var(--gold)}
.role.primary::after{
  content:"";position:absolute;left:18px;right:18px;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8;
}

/* ---------- forms ---------- */
.field{margin-top:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px 2px}
.field input,.field textarea{
  width:100%;padding:14px 15px;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid transparent;border-radius:14px;outline:0;
  transition:border-color .2s ease,background .2s ease;
}
.field textarea{resize:none;min-height:110px;line-height:1.5}
.field input:focus,.field textarea:focus{background:var(--paper);border-color:var(--blue)}
.btn{
  width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;
  background:var(--blue);color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  letter-spacing:-.01em;
  transition:transform .2s var(--spring),opacity .2s ease;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.34}
.btn.ghost{background:transparent;color:var(--blue);margin-top:8px}
.linkline{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}
.linkline b{color:var(--blue);font-weight:600}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{
  padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font-size:13.5px;font-weight:500;font-family:inherit;color:var(--ink);
  transition:transform .2s var(--spring),background .2s ease,border-color .2s ease,color .2s ease;
}
.chip .code{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px;transition:color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on .code{color:rgba(255,255,255,.66)}

/* ---------- lists ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{
  display:flex;align-items:center;gap:13px;padding:14px 16px;width:100%;
  background:transparent;border:0;font:inherit;color:inherit;text-align:left;
  transition:background .16s ease;
}
.row + .row{border-top:1px solid var(--line-soft)}
.row:active{background:var(--surface)}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--blue-tint);color:var(--blue-deep);font-size:14px;font-weight:600;letter-spacing:-.02em;
}
.avatar.gold{background:var(--gold-tint);color:var(--gold)}
.rmain{flex:1;min-width:0}
.rname{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.rmeta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rside{display:flex;align-items:center;gap:8px;color:var(--muted-2);flex:0 0 auto}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 auto}

.tag{
  display:inline-block;padding:3px 8px;border-radius:6px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
}
.tag.lect{background:var(--gold-tint);color:var(--gold)}
.tag.admin{background:var(--blue-tint);color:var(--blue-deep)}
.tag.mod{background:var(--surface);color:var(--muted)}

/* ---------- metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.metric{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.metric .n{font-size:26px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.metric .l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.metric.accent .n{color:var(--gold)}

/* ---------- timeline (signature) ---------- */
.timeline{position:relative;padding-left:26px;margin-top:6px}
.timeline::before{
  content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line);
}
.tl{
  position:relative;padding:14px 0;border-bottom:1px solid var(--line-soft);
  width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;
  font:inherit;color:inherit;display:block;
}
.tl:last-child{border-bottom:0}
.tl::before{
  content:"";position:absolute;left:-25px;top:20px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);border:2px solid var(--line);
  transition:border-color .3s var(--ease),background .3s var(--ease),transform .34s var(--spring);
}
.tl.mine::before{border-color:var(--blue);background:var(--blue)}
.tl.unread::before{border-color:var(--gold);background:var(--gold);transform:scale(1.18)}
.tl.open::before{transform:scale(1.3)}
.tl-top{display:flex;align-items:baseline;gap:10px}
.tl-topic{font-size:15.5px;font-weight:600;letter-spacing:-.02em;flex:1;transition:color .2s}
.tl.open .tl-topic{color:var(--blue-deep)}
.tl-who{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px}
.tl-body{
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .44s var(--ease),opacity .3s var(--ease),margin .44s var(--ease);
  margin-top:0;
}
.tl.open .tl-body{opacity:1;margin-top:10px}
.tl-body .txt{display:block;font-size:14.5px;line-height:1.58;color:#33415C}
.tl-body .reply{
  margin-top:12px;padding:0;border:0;background:transparent;font:inherit;
  color:var(--blue);font-size:14px;font-weight:600;
}

/* ---------- empty ---------- */
.empty{text-align:center;padding:70px 24px}
.empty .g{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;background:var(--surface);display:grid;place-items:center;color:var(--muted-2)}
.empty h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em}
.empty p{margin:6px 0 0;font-size:14px;color:var(--muted)}

/* ---------- tab bar ---------- */
.tabbar{
  flex:0 0 auto;display:flex;
  padding:8px 6px calc(6px + var(--sab));
  border-top:1px solid var(--line-soft);
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
.tab{
  flex:1;border:0;background:transparent;font:inherit;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted-2);transition:color .2s ease,transform .2s var(--spring);
}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--blue)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:-.005em}
.tab .wrap{position:relative}

/* ---------- fab ---------- */
.fab{
  position:absolute;right:18px;bottom:calc(20px + var(--sab));
  height:50px;padding:0 20px;border:0;border-radius:25px;
  background:var(--blue);color:#fff;font:inherit;font-size:15px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 12px 26px -10px rgba(26,79,214,.75);
  transition:transform .24s var(--spring);z-index:6;
}
.fab:active{transform:scale(.93)}

/* ---------- sheet ---------- */
#scrim{
  position:absolute;inset:0;background:rgba(11,27,51,.4);opacity:0;pointer-events:none;
  transition:opacity .36s var(--ease);z-index:20;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  background:var(--paper);border-radius:26px 26px 0 0;
  padding:10px 18px calc(20px + var(--sab));
  transform:translate3d(0,110%,0);
  transition:transform .46s var(--ease);
  box-shadow:0 -20px 50px -20px rgba(11,27,51,.3);
}
#sheet.on{transform:translate3d(0,0,0)}
#sheet.drag{transition:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-title{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:0 0 2px}
.sheet-sub{font-size:13px;color:var(--muted);margin:0}

/* ---------- toast ---------- */
#toast{
  position:absolute;left:50%;bottom:calc(96px + var(--sab));z-index:40;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;
  padding:11px 18px;border-radius:14px;white-space:nowrap;
  transition:opacity .3s var(--ease),transform .38s var(--spring);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- stagger ---------- */
.stagger > *{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>

<div id="device">
  <div id="stage"></div>
  <div id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

/* ============ helpers ============ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const stage = $('#stage'), scrim = $('#scrim'), sheet = $('#sheet'), toastEl = $('#toast');

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(n){ return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function modName(c){ const m = MODULES.find(x=>x.c===c); return m? m.n : c; }

function ago(ts){
  const d = now - ts;
  if(d < MIN) return 'now';
  if(d < HR) return Math.round(d/MIN)+'m';
  if(d < DAY) return Math.round(d/HR)+'h';
  if(d < 2*DAY) return 'Yesterday';
  if(d < 7*DAY) return Math.round(d/DAY)+'d';
  return new Date(ts).toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
}
function fullTime(ts){
  return new Date(ts).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}

/* haptics: real on Android, best effort elsewhere */
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||8); }catch(e){} }

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('on'), 1900);
}

/* ============ state ============ */
const state = { role:null, name:'', subjects:[], tab:'home', tutor:null };

function unreadFor(role){
  if(role === 'tutor') return MESSAGES.filter(m=>m.tutor==='t1' && m.unread && !m.mine).length;
  return 0;
}
function threadFor(tid){
  return MESSAGES.filter(m=>m.tutor===tid).sort((a,b)=>b.ts-a.ts);
}

/* ============ router ============ */
const stack = [];

function go(html, mode){
  const el = document.createElement('div');
  el.className = 'screen enter' + (mode==='fade' ? ' fade' : '');
  el.innerHTML = html;
  stage.appendChild(el);
  const prev = stack[stack.length-1];
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    el.classList.remove('enter');
    if(prev && mode!=='fade') prev.classList.add('behind');
    if(prev && mode==='fade') prev.style.opacity = '0';
  });});
  stack.push(el);
  return el;
}

function back(){
  if(stack.length < 2) return;
  haptic(6);
  const el = stack.pop();
  const prev = stack[stack.length-1];
  prev.classList.remove('behind');
  prev.style.opacity = '';
  el.classList.add('enter');
  setTimeout(()=>el.remove(), 480);
}

function reset(html){
  stack.forEach(s=>s.remove());
  stack.length = 0;
  go(html,'fade');
}

}

/* drag to dismiss */
(function(){
  let y0=null, dy=0;
  sheet.addEventListener('pointerdown', e=>{
    if(e.target.closest('input,textarea,button')) return;
    y0 = e.clientY; dy = 0; sheet.classList.add('drag');
  });
  window.addEventListener('pointermove', e=>{
    if(y0===null) return;
    dy = Math.max(0, e.clientY - y0);
    sheet.style.transform = `translate3d(0,${dy}px,0)`;
  });
  window.addEventListener('pointerup', ()=>{
    if(y0===null) return;
    sheet.classList.remove('drag');
    sheet.style.transform = '';
    if(dy > 90) closeSheet();
    y0 = null;
  });
})();

        <span class="rside" style="color:var(--muted-2)">${I.doc}</span></div>
    </div>
    <button class="btn" data-approve="${a.id}">Approve tutor</button>
    <button class="btn ghost" data-decline="${a.id}">Decline</button>
  `);
}

/* ============ events ============ */
document.addEventListener('click', e=>{
  const t = e.target;

  const back_ = t.closest('[data-back]');
  if(back_){ back(); return; }

  const role = t.closest('[data-role]');
  if(role){
    haptic(9);
    state.role = role.dataset.role;
    go(vAuth(state.role, 'signin'));
    return;
  }

  const swap = t.closest('[data-swap]');
  if(swap){
    haptic(6);
    stack.pop().remove();
    const prev = stack[stack.length-1];
    if(prev){ prev.classList.remove('behind'); }
    go(vAuth(swap.dataset.swap, swap.dataset.mode));
    return;
  }

  const auth = t.closest('[data-auth]');
  if(auth){
    haptic(12);
    const nameEl = $('#f-name');
    if(nameEl && nameEl.value.trim()) state.name = nameEl.value.trim();
    if(state.role==='lecturer' && auth.dataset.mode==='register'){ go(vSubjects()); return; }
    state.tab = state.role==='tutor' ? 'home' : state.role==='admin' ? 'home' : 'tutors';
    renderApp();
    return;
  }

  const mod = t.closest('[data-mod]');
  if(mod){
    haptic(7);
    mod.classList.toggle('on');
    const c = mod.dataset.mod;
    const i = state.subjects.indexOf(c);
    if(i>-1) state.subjects.splice(i,1); else state.subjects.push(c);
    $('#mods-done').disabled = state.subjects.length === 0;
    return;
  }

  if(t.closest('#mods-done')){
    haptic(12);
    state.tab = 'tutors';
    renderApp();
    return;
  }

  const tab = t.closest('[data-tab]');
  if(tab){
    if(state.tab === tab.dataset.tab) return;
    haptic(6);
    state.tab = tab.dataset.tab;
    if(state.tab === 'inbox'){
      MESSAGES.forEach(m=>{ if(m.tutor==='t1' && !m.mine) m.unread = false; });
    }
    renderApp('swap');
    return;
  }

  const thread = t.closest('[data-thread]');
  if(thread){
    haptic(8);
    const tid = thread.dataset.thread;
    MESSAGES.forEach(m=>{ if(m.tutor===tid) m.unread = false; });
    state.tutor = tid;
    go(vThread(tid));
    return;
  }

  const msg = t.closest('[data-msg]');
  if(msg){
    haptic(5);
    const bodyEl = msg.querySelector('.tl-body');
    const open = msg.classList.contains('open');
    $$('.tl.open').forEach(o=>{ o.classList.remove('open'); o.querySelector('.tl-body').style.maxHeight = '0px'; });
    if(!open){
      msg.classList.add('open');
      bodyEl.style.maxHeight = bodyEl.scrollHeight + 20 + 'px';
    }
    return;
  }

  const compose = t.closest('[data-compose]');
  if(compose){ haptic(9); composeSheet(compose.dataset.compose); return; }

  const send = t.closest('[data-send]');
  if(send){
    const topic = ($('#c-topic').value || '').trim();
    const body  = ($('#c-body').value || '').trim();
    if(!topic || !body){ haptic(24); toast('Add a topic and a message'); return; }
    haptic(14);
    const tid = send.dataset.send;
    MESSAGES.unshift({
      id:'m'+Date.now(), tutor:tid, mine:true, unread:false,
      from:{ name:'You', role: state.role==='admin'?'admin':'lecturer' },
      topic, body, ts: Date.now()
    });
    closeSheet();
    setTimeout(()=>{
      const el = stack[stack.length-1];
      el.innerHTML = vThread(tid);
      toast('Message sent');
    }, 240);
    return;
  }

  const app = t.closest('[data-app]');
  if(app){ haptic(8); applicantSheet(app.dataset.app); return; }

  const approve = t.closest('[data-approve]');
  if(approve){
    haptic(16);
    const a = APPLICANTS.find(x=>x.id===approve.dataset.approve);
    const i = APPLICANTS.indexOf(a);
    APPLICANTS.splice(i,1);
    TUTORS.push({id:'t'+Date.now(), name:a.name, mods:[a.mod], sessions:0});
    closeSheet();
    setTimeout(()=>{ renderApp('swap'); toast(a.name.split(' ')[0] + ' approved'); }, 240);
    return;
  }

  const decline = t.closest('[data-decline]');
  if(decline){
    haptic(16);
    const a = APPLICANTS.find(x=>x.id===decline.dataset.decline);
    APPLICANTS.splice(APPLICANTS.indexOf(a),1);
    closeSheet();
    setTimeout(()=>{ renderApp('swap'); toast('Application declined'); }, 240);
    return;
  }

  const mark = t.closest('[data-mark]');
  if(mark){
    haptic(14);
    mark.textContent = 'Marked';
    mark.style.background = 'var(--blue)';
    mark.style.color = '#fff';
    mark.style.borderColor = 'var(--blue)';
    toast('Attendance marked');
    return;
  }

  if(t.closest('[data-signout]')){
    haptic(10);
    state.role = null; state.subjects = []; state.name = '';
    reset(vRole());
    return;
  }
});

/* edge swipe back */
(function(){
  let x0=null, y0=null, active=false;
  stage.addEventListener('touchstart', e=>{
    const tch = e.touches[0];
    if(tch.clientX < 26 && stack.length > 1){ x0 = tch.clientX; y0 = tch.clientY; active = true; }
  }, {passive:true});
  stage.addEventListener('touchmove', e=>{
    if(!active) return;
    const tch = e.touches[0];
    if(Math.abs(tch.clientY - y0) > 60){ active = false; return; }
    if(tch.clientX - x0 > 70){ active = false; back(); }
  }, {passive:true});
  stage.addEventListener('touchend', ()=>{ active = false; }, {passive:true});
})();

/* boot */
go(vRole(), 'fade');
</script>
