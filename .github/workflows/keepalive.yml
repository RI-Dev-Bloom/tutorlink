# Free Supabase projects pause after 7 days of no use. This pings the database daily.
# It also commits a timestamp, because GitHub switches off scheduled workflows
# in repos that have had no commits for 60 days.
name: Keep alive

on:
  schedule:
    - cron: '17 4 * * *'   # every day, 06:17 South African time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
      - uses: actions/checkout@v4
      - name: Record the ping
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-ping
          git config user.name  "tutorlink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-ping
          git commit -m "Keep-alive ping" || exit 0
          git push
